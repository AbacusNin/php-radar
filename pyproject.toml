[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "php-radar"
version = "0.2.0"
description = "Finds PHP installs and grades them against PHP2Shell (CVE-2026-109618, CVE-2026-109619) without triggering the bug."
readme = "README.md"
license = "LicenseRef-Apache-2.0-with-Commons-Clause"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "AbacusNin" }]
# Every extra includes an SDK whose current release needs 3.10, and 3.9 is end of life.
# azure-mgmt-resource-subscriptions also has no release that installs on 3.9.
requires-python = ">=3.10"
keywords = ["php", "php2shell", "vulnerability", "scanner", "security", "inventory", "sarif"]
# No License classifier: the license expression above replaces it, and setuptools refuses both.
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Information Technology",
    "Intended Audience :: System Administrators",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Security",
    "Topic :: System :: Systems Administration",
]
# Standard library only. The SDKs of each cloud live in an extra named for that provider.
dependencies = []

[project.optional-dependencies]
aws = ["boto3"]
gcp = [
    "google-cloud-appengine-admin",
    "google-cloud-functions",
    "google-cloud-artifact-registry",
]
azure = [
    "azure-identity",
    "azure-mgmt-web",
    "azure-mgmt-appcontainers",
    "azure-mgmt-containerregistry",
    "azure-containerregistry",
    "azure-mgmt-resource-subscriptions",
]

[project.urls]
Homepage = "https://github.com/AbacusNin/php-radar"
Issues = "https://github.com/AbacusNin/php-radar/issues"

[project.scripts]
php-radar = "php_radar.cli:main"

[tool.setuptools.packages.find]
include = ["php_radar*"]

# php_radar/data/php2shell.json holds the vulnerability matrix and has to travel with the wheel.
[tool.setuptools.package-data]
php_radar = ["data/*.json"]

# Lets a bare pytest import php_radar from a fresh checkout, no editable install.
[tool.pytest.ini_options]
pythonpath = ["."]
